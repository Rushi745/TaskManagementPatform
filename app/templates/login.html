{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
  <form method="post" class="card border-0 shadow-sm mt-4"><div class="card-body p-4">
    <h1 class="h4 mb-1"><i class="bi bi-arrow-left-right"></i> HandOff</h1>
    <p class="text-muted small mb-4">Accounts are pre-generated for your team. No sign-up.</p>
    {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
    <div class="mb-2"><label class="form-label small mb-0">Team ID</label><input class="form-control" name="team_id" required autocomplete="organization" placeholder="{{ team_id }}"></div>
    <div class="mb-2"><label class="form-label small mb-0">User ID</label><input class="form-control" name="user_id" required autocomplete="username" placeholder="e.g. rahul"></div>
    <div class="mb-3"><label class="form-label small mb-0">Password</label><input class="form-control" type="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-dark w-100">Log in</button>
  </div></form>
</div></div>
{% endblock %}
