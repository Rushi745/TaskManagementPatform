{% extends "base.html" %}
{% block title %}People{% endblock %}
{% block content %}
<h1 class="h3 mb-3">People</h1>
<div class="row g-4">
  <div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="table-responsive">
    <table class="table mb-0 align-middle"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>User ID</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
  <div class="col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body small text-muted"><i class="bi bi-shield-lock"></i> Accounts are pre-generated for the team. There is no sign-up; ask your admin to add people.</div></div></div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function load() {
  const people = await loadPeople();
  document.getElementById("rows").innerHTML = people.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.email)}</td><td>${esc(p.role)}</td><td><code>${esc(p.username || "")}</code></td>
    <td><span class="badge text-bg-${p.status === "active" ? "success" : "warning"}">${p.status.replace("_", " ")}</span>
    ${p.status === "on_leave" ? `<button class="btn btn-link btn-sm" onclick="back('${p.id}')">Mark active</button>` : ""}</td></tr>`).join("");
}
async function back(id) { await api("PATCH", `/api/people/${id}`, { status: "active" }); toast("Marked active"); load(); }
load();
</script>
{% endblock %}
